# Content discovery source registry (Phase 9). Sources live only here, never in code or
# in retrieved content. Each entry is read through an official API or the publisher's own
# feed; nothing is scraped. Credibility (`tier`) describes the publisher, not whether any
# claim is true.
#
# Feed URLs below were checked on 2026-10-13 (each returned a valid RSS 2.0 document).
# GitHub releases use the REST API (`GET /repos/{owner}/{repo}/releases`); X sources use
# the existing recent-search integration and its X_BEARER_TOKEN. Disable a source with
# `enabled = false`. Curated X handles are yours to choose; the list ships empty.

version = "2026-10-13"

# Topic vocabulary for relevance, keywords and audience matching. Phrases match on word
# boundaries, case-insensitively.
vocabulary = [
  "agent", "agents", "agentic", "multi-agent", "tool use", "function calling", "mcp",
  "langgraph", "orchestration", "workflow", "evals", "evaluation", "benchmark",
  "benchmarks", "llm", "llms", "inference", "serving", "vllm", "fine-tuning", "rag",
  "retrieval", "embedding", "embeddings", "mlops", "gpu", "kubernetes", "observability",
  "open-source", "open source", "reasoning", "coding agent", "code generation",
  "automation", "developer", "developers", "api", "safety", "alignment", "human oversight",
  "small model", "small models", "distillation", "quantization", "context window",
]

# Vocabulary terms too broad to make a @grok question's subject specific (criterion 3).
# Each domain's registry lists its own.
generic_terms = [
  "agent", "agents", "agentic", "llm", "llms", "developer", "developers", "automation",
  "workflow", "api", "safety", "open source", "open-source",
]

[weights]
topic_relevance = 0.25
timeliness = 0.15
source_credibility = 0.15
evidence_quality = 0.15
novelty = 0.10
discussion_potential = 0.05
strategy_fit = 0.15

[policy]
timeliness_half_life_hours = 72
cluster_similarity = 0.6
own_post_similarity = 0.6
novelty_window_days = 30
fingerprint_suppression_days = 14
dismissed_suppression_days = 30
opportunity_ttl_days = 7
grok_freshness_days = 14
grok_dedup_days = 90
grok_similarity = 0.5
max_opportunities = 10
# Shortlist diversity: of the top `shortlist_size` places, at most
# `max_per_project_in_shortlist` go to one GitHub project (owner/repo). The others keep
# their score and follow in score order; nothing is dropped.
shortlist_size = 5
max_per_project_in_shortlist = 2
max_audience_entries = 10

[[sources]]
id = "openai-news"
kind = "feed"
category = "primary"
publisher = "OpenAI"
tier = "official"
evidence_type = "official_announcement"
url = "https://openai.com/news/rss.xml"
topics = ["models", "agents"]

[[sources]]
id = "deepmind-news"
kind = "feed"
category = "primary"
publisher = "Google DeepMind"
tier = "official"
evidence_type = "official_announcement"
url = "https://deepmind.google/blog/rss.xml"
topics = ["models", "research"]

[[sources]]
id = "huggingface-blog"
kind = "feed"
category = "primary"
publisher = "Hugging Face"
tier = "official"
evidence_type = "engineering_blog"
url = "https://huggingface.co/blog/feed.xml"
topics = ["open models", "infrastructure"]

[[sources]]
id = "arxiv-cs-ai"
kind = "feed"
category = "primary"
publisher = "arXiv cs.AI"
tier = "primary_research"
evidence_type = "paper"
url = "https://rss.arxiv.org/rss/cs.AI"
topics = ["research"]

[[sources]]
id = "langgraph-releases"
kind = "github_releases"
category = "primary"
publisher = "LangGraph (GitHub)"
tier = "official"
evidence_type = "release"
repo = "langchain-ai/langgraph"
