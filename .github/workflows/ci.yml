name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sga
          POSTGRES_PASSWORD: sga-ci-only
          POSTGRES_DB: sga
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI=true is set by GitHub Actions: DB tests fail (never skip) without this URL.
      TEST_DATABASE_URL: postgresql://sga:sga-ci-only@localhost:5432/sga
      DATABASE_URL: postgresql://sga:sga-ci-only@localhost:5432/sga
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrate a fresh database
        run: uv run sga-db upgrade && uv run sga-db current
      - name: Full test suite, including PostgreSQL tests
        run: uv run pytest -m "not live" -rs
      - name: Restart demo (offline)
        run: uv run python -m social_growth_agent.services.restart_demo
      - name: Publishing demo (offline; PUBLISHER_PROVIDER defaults to mock)
        run: uv run python -m social_growth_agent.services.publish_demo
      - name: The publisher worker publishes nothing when nothing was requested
        run: uv run sga-publisher-worker --once && uv run sga-publisher-worker --dry-run
