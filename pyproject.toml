[project]
name = "social-growth-agent"
version = "0.1.0"
description = "Agentic social-media growth orchestration: research, generate, critique, approve, publish, learn."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.60",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
sga-db = "social_growth_agent.persistence.cli:main"
sga-publisher-worker = "social_growth_agent.services.publisher_cli:main"
sga-analytics-worker = "social_growth_agent.services.analytics_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_growth_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: calls real external APIs; opt-in via RUN_LIVE_LLM_TESTS=1, RUN_LIVE_X_TESTS=1, RUN_LIVE_X_ANALYTICS_TESTS=1 or RUN_LIVE_X_PUBLISH_TESTS=1 (publishing also needs CONFIRM_LIVE_X_PUBLISH=YES)",
    "db: needs PostgreSQL via TEST_DATABASE_URL; skipped locally without it, required in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["social_growth_agent", "tests"]

[[tool.mypy.overrides]]
# Tests use pytest fixtures without annotations; src/ stays fully strict.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
